name: Update Forgejo stats


on:
  schedule:
    - cron: "0 3 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Aggregate Forgejo heatmap
        run: python3 tools/update-forgejo-stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forgejo-contributions.json
          git diff --cached --quiet || git commit -m "chore: update Forgejo contributions stats"
          git push
